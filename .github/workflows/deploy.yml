name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Aplica supabase/migrations/** no banco remoto antes do build.
  # A senha do banco fica em Settings → Secrets and variables → Actions:
  #   SUPABASE_DB_PASSWORD  (Project Settings → Database → senha do Postgres)
  #   SUPABASE_ACCESS_TOKEN (Personal Access Token, usado pelo CLI)
  # Sem esses dois secrets o job apenas emite um aviso e o deploy segue,
  # para não travar o site por causa de configuração pendente.
  migrations:
    runs-on: ubuntu-latest
    # Duas execuções simultâneas colidiriam no histórico de migrations.
    concurrency:
      group: migrations-${{ github.ref }}
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Aplicar migrations no banco remoto
        if: env.SUPABASE_DB_PASSWORD != '' && env.SUPABASE_ACCESS_TOKEN != ''
        # A senha chega só pela variável de ambiente (o CLI lê
        # SUPABASE_DB_PASSWORD automaticamente), nunca pela linha de comando.
        run: supabase db push --project-ref chllhailtkuffciaanlx --yes

      - name: Secrets ausentes — migrations ignoradas
        if: env.SUPABASE_DB_PASSWORD == '' || env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::warning::SUPABASE_DB_PASSWORD / SUPABASE_ACCESS_TOKEN não configurados; migrations não aplicadas."
          echo "Configure em Settings → Secrets and variables → Actions."

  build:
    needs: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
        run: bun run build

      - name: SPA fallback (deep links)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
